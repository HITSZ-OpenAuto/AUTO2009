[lecturers]

[[lecturers.items]]
name = "熊小刚"

[[lecturers.items.reviews]]
content = "章节顺序按照教材，小节内思路有变化。念PPT自娱自乐为主，基本上不补充前置知识，有时扯两嘴强化学习和多体运动学，但没有实质性内容。使用豆包把教材转为PPT，起初不校对让学生看Latex代码，后面改正。"
author = { name = "shiftcarl", link = "https://github.com/shiftcarl", date = "2026-07" }

[[sections]]
title = "考核方式"

[[sections.items]]
content = """
2024 级的考核分为课程设计和实验两方面。
课程设计为单人独立选择一个仿真项目完成，并通过报告展示工作，具体见仓库。老师推荐用 Drake，但很多同学都是用 AI 从头搓的。
实验内容为 ROS 仿真配置和 MPC 参数调整，不需要理解 MPC，不提供报告模板自由发挥。
"""
author = { name = "shiftcarl", link = "https://github.com/shiftcarl", date = "2026-07" }

[[sections]]
title = "课程简介"

[[sections.items]]
content = """
### 关于教材
2024 级自动化方向的培养方案中，这门课的前置知识严重缺失，而且引入大量新概念。绪论PPT中认为学生应该先学习理论力学、经典控制、数值优化乃至强化学习，但显然必修中对应的只有大学物理、电路与电子学、程序设计与实践，而理论力学是机械方向的限选，经典控制是大三的课程。
前八章内容：
- 欠驱动系统的定义、重要性、特点
- 单摆，了解经典控制，引入能量成型控制
- 2~3 自由度欠驱动模型，引入局部线性化分析可控性和部分反馈线性化解耦
- 行走模型和跳跃/跑步模型，引入周期稳定和冲量
- 用质心思想研究复杂机器人足系统
- 为之前的模型加入随机性
- 动态规划/全局优化，引入 HJB 方程
- 推导约束下的 LQR 控制器
"""
author = [
  { name = "shiftcarl", link = "https://github.com/shiftcarl", date = "2026-07" },
]

[[sections.items]]
content = """
### 关于实验
应该可以后续自己补完
- 熟悉 Linux 和 ROS 的使用，成功运行 launch 文件（2 学时）
- 熟悉 rosbag 和 rqt，调整车载倒立摆模型的 MPC 控制参数（2 学时）
（貌似滞后启动控制，初状态还不同难以复现，求大佬出手）
- 熟悉 gazebo，调整两足机器人模型的控制参数使其能跨过台阶障碍（4 学时）
（手操累加式控制是最大不稳定因素来源）
"""
author = [
  { name = "shiftcarl", link = "https://github.com/shiftcarl", date = "2026-07" },
]

