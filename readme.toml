course_code = "AUTO2009"
repo_type = "normal"
description = """
待补

这门课是机器人与智能装备专业自动化方向的限选课，2026 年改为大二课程，开设定位相当于机器人学导论，但实际上是机器人学的拓展。使用的教材为 MIT 的 [Underactuated Robotics](https://underactuated.mit.edu)，授课范围为前八章。
